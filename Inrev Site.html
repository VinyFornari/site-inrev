  <style>
    :root {
      --bg-primary: #0A0A0A;
      --bg-secondary: #111111;
      --bg-light: #FAFAF8;
      --bg-white: #FFFFFF;
      --accent-neon: #A855F7;
      --accent-magenta: #DD2872;
      --accent-cyan: #0BC5FE;
      --accent-blue: #0B66FF;
      --text-white: #FFFFFF;
      --text-dark: #0F1926;
      --text-muted: #6B7280;
      --text-muted-light: #9CA3AF;
      --font-heading: 'Plus Jakarta Sans', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --max-width: 1200px;
      --header-h: 72px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font-body);
      color: var(--text-dark);
      background: var(--bg-primary);
      overflow-x: hidden;
      line-height: 1.6;
    }
    img { max-width: 100%; display: block; }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; border: none; background: none; font-family: inherit; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

    /* ===== Scroll Reveal ===== */
    .sr {
      opacity: 0;
      transform: translateY(32px);
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sr.visible { opacity: 1; transform: translateY(0); }

    /* ===== Hero Entrance ===== */
    @keyframes heroFadeUp {
      from { opacity: 0; transform: translateY(44px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .hero-anim {
      opacity: 0;
      animation: heroFadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* ===== Blob Animations ===== */
    @keyframes blobA {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(60px, -90px) scale(1.12); }
      50% { transform: translate(-40px, 60px) scale(0.92); }
      75% { transform: translate(90px, 20px) scale(1.06); }
    }
    @keyframes blobB {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(-70px, 50px) scale(1.14); }
      66% { transform: translate(50px, -70px) scale(0.88); }
    }
    @keyframes blobC {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(80px, 40px) scale(1.18); }
      50% { transform: translate(-60px, -50px) scale(0.82); }
      75% { transform: translate(-30px, 70px) scale(1.08); }
    }

    /* ===== Header ===== */
    .site-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--header-h);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.4s, backdrop-filter 0.4s, border-color 0.4s;
      border-bottom: 1px solid transparent;
    }
    .site-header.scrolled {
      background: rgba(10,10,10,0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom-color: rgba(255,255,255,0.06);
    }
    .header-nav {
      display: flex;
    }
    .header-nav a {
      color: rgba(255,255,255,0.6);
      font-size: 13px; font-weight: 500; letter-spacing: 0.5px;
      transition: color 0.25s;
      font-family: var(--font-heading);
    }
    .header-nav a:hover { color: var(--accent-neon); }
    .header-cta {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--accent-neon);
      color: #fff; font-size: 13px; font-weight: 600;
      padding: 10px 22px; border-radius: 8px;
      letter-spacing: 0.3px; transition: background 0.25s, transform 0.2s;
      font-family: var(--font-heading);
    }
    .header-cta:hover { background: #7c3aed; transform: translateY(-1px); }

    /* ===== Mobile Menu Toggle ===== */
    .menu-toggle {
      display: none; width: 28px; height: 20px;
      flex-direction: column; justify-content: space-between;
      z-index: 110;
    }
    .menu-toggle span {
      display: block; width: 100%; height: 2px;
      background: #fff; border-radius: 2px;
      transition: transform 0.3s, opacity 0.3s;
    }
    .menu-toggle.open span:first-child { transform: rotate(45deg) translate(6px, 6px); background: var(--accent-neon); }
    .menu-toggle.open span:nth-child(2) { opacity: 0; }
    .menu-toggle.open span:last-child { transform: rotate(-45deg) translate(6px, -6px); background: var(--accent-neon); }

    .mobile-overlay {
      position: fixed; inset: 0; z-index: 105;
      background: rgba(10,10,10,0.99);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px;
      opacity: 0; pointer-events: none; transition: opacity 0.35s;
    }
    .mobile-overlay.open { opacity: 1; pointer-events: all; }
    .mobile-overlay a {
      color: #fff; font-family: var(--font-heading);
      font-size: 28px; font-weight: 700; letter-spacing: 1px;
      opacity: 0; transform: translateY(20px);
      transition: opacity 0.4s, transform 0.4s, color 0.2s;
    }
    .mobile-overlay.open a {
      opacity: 1; transform: translateY(0);
    }
    .mobile-overlay a:hover { color: var(--accent-neon); }

    /* ===== Tab Buttons ===== */
    .tab-btn {
      position: relative; padding: 16px 0;
      color: rgba(255,255,255,0.4); font-family: var(--font-heading);
      font-size: 15px; font-weight: 700; letter-spacing: 1px;
      transition: color 0.3s;
    }
    .tab-btn.active { color: #fff; }
    .tab-btn::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0;
      height: 3px; border-radius: 3px; transform: scaleX(0);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .tab-btn.active::after { transform: scaleX(1); }

    /* ===== Service Cards ===== */
    .svc-card {
      padding: 36px 32px; border: 1px solid #E8E8E8; border-radius: 14px;
      background: #fff; transition: border-color 0.3s, transform 0.35s, box-shadow 0.35s;
    }
    .svc-card:hover {
      border-color: var(--accent-neon); transform: translateY(-6px);
      box-shadow: 0 24px 48px rgba(0,0,0,0.07);
    }

    /* ===== Form ===== */
    .form-input {
      width: 100%; padding: 16px 20px;
      background: #F3F4F6; border: 1.5px solid transparent; border-radius: 10px;
      font-size: 15px; font-family: var(--font-body); color: var(--text-dark);
      transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
      outline: none;
    }
    .form-input:focus {
      border-color: var(--accent-neon); background: #fff;
      box-shadow: 0 0 0 3px rgba(214,251,0,0.12);
    }
    .form-input::placeholder { color: #9CA3AF; }
    .submit-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--bg-primary); color: #fff;
      font-family: var(--font-heading); font-size: 15px; font-weight: 700;
      padding: 16px 40px; border-radius: 10px; letter-spacing: 0.5px;
      transition: background 0.3s, transform 0.2s;
    }
    .submit-btn:hover { background: #222; transform: translateY(-2px); }

    /* ===== Footer Links ===== */
    .ft-link { color: var(--text-muted-light); transition: color 0.2s; }
    .ft-link:hover { color: var(--accent-neon); }

    /* ===== Responsive ===== */
    @media (max-width: 1024px) {
      .header-nav { display: none; }
      .menu-toggle { display: flex; }
      .hero-globe { display: none !important; }
      .hero-globe-wrapper { display: none !important; }
    }
    @media (max-width: 768px) {
      :root { --header-h: 60px; }
      #hero { min-height: auto !important; padding-top: 90px !important; padding-bottom: 40px !important; padding-left: 20px !important; padding-right: 20px !important; }
      .hero-globe-wrapper { display: none !important; }
      .header-cta { font-size: 11px !important; padding: 8px 16px !important; }
      #hero h1 { font-size: 32px !important; margin-bottom: 20px !important; }
      #hero p { font-size: 14px !important; margin-bottom: 28px !important; }
      #hero .hero-anim a { font-size: 13px !important; padding: 12px 24px !important; }
      .hero-mobile-effect {
        display: block !important;
        position: absolute;
        bottom: -40px; left: 50%; transform: translateX(-50%);
        width: 360px; height: 360px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, rgba(168,85,247,0.08) 0%, rgba(168,85,247,0.03) 40%, transparent 70%);
        pointer-events: none;
        animation: mobileGlow 6s ease-in-out infinite;
      }
      .hero-mobile-ring1, .hero-mobile-ring2 {
        display: block !important;
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(168,85,247,0.08);
        pointer-events: none;
      }
      .hero-mobile-ring1 {
        width: 240px; height: 240px;
        bottom: 20px; left: 50%; transform: translateX(-50%);
        animation: mobileRing 8s ease-in-out infinite;
      }
      .hero-mobile-ring2 {
        width: 340px; height: 340px;
        bottom: -30px; left: 50%; transform: translateX(-50%);
        border-color: rgba(168,85,247,0.05);
        animation: mobileRing 10s ease-in-out infinite reverse;
      }
    }
    @keyframes mobileGlow {
      0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.06); }
    }
    @keyframes mobileRing {
      0%, 100% { opacity: 0.4; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.08); }
    }
    @media (max-width: 900px) {
      .hero-content-grid {
        grid-template-columns: 1fr !important;
      }
      .hero-globe-wrapper {
        max-width: 320px;
        margin: 0 auto;
      }
    }
  </style>
